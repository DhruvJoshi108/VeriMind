databases:
  - name: verimind-db
    plan: free
    databaseName: verimind
    user: verimind

envVarGroups:
  - name: verimind-api-auth
    envVars:
      - key: API_KEY
        generateValue: true

services:
  - type: web
    name: verimind-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-api-deploy.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SEARCH_BACKEND
        value: "null"
      - key: JUDGE_BACKEND
        value: local
      - key: DATABASE_URL
        fromDatabase:
          name: verimind-db
          property: connectionString
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: verimind-dashboard
          envVarKey: RENDER_EXTERNAL_URL
      - key: REDIS_URL
        value: ""
      - fromGroup: verimind-api-auth

  - type: web
    name: verimind-dashboard
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r dashboard/requirements.txt
    startCommand: cd dashboard && PYTHONPATH=.. streamlit run app.py --server.address=0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    envVars:
      - key: VERIMIND_API_URL
        fromService:
          type: web
          name: verimind-api
          envVarKey: RENDER_EXTERNAL_URL
      - fromGroup: verimind-api-auth
