envVarGroups:
  - name: verimind-api-auth
    envVars:
      - key: API_KEY
        sync: false

services:
  - type: web
    name: verimind-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-api-deploy.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SEARCH_BACKEND
        value: "null"
      - key: JUDGE_BACKEND
        value: local
      - key: CORS_ORIGINS
        value: https://verimind-dashboard.onrender.com
      - fromGroup: verimind-api-auth

  - type: web
    name: verimind-dashboard
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r dashboard/requirements.txt
    startCommand: cd dashboard && PYTHONPATH=.. streamlit run app.py --server.address=0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    envVars:
      - key: VERIMIND_API_URL
        value: https://verimind-api.onrender.com
      - fromGroup: verimind-api-auth
