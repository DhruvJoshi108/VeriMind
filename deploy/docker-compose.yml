services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ../.env
    environment:
      NLI_DEVICE: cpu
    volumes:
      - verimind-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    env_file:
      - ../.env
    environment:
      VERIMIND_API_URL: http://api:8000
      VERIMIND_EVAL_RESULTS_DIR: /app/eval/results
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../results:/app/results:ro
      - ../eval/results:/app/eval/results:ro
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  verimind-data:
